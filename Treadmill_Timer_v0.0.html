<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run timer">
<title>Treadmill Timer v0.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:-apple-system,system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{height:100dvh;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),14px) 16px max(env(safe-area-inset-bottom),14px);background:#222}
.top{display:flex;justify-content:space-between;font-size:15px;opacity:.8}
#name{font-size:min(9vw,5dvh);font-weight:600;margin-top:2dvh}
#count{font-size:min(34vw,20dvh);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin:1dvh 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:rgba(0,0,0,.28);border-radius:14px;padding:12px 14px}
.lab{font-size:13px;opacity:.75}
.big{font-size:min(11vw,6dvh);font-weight:600}
.sub{font-size:15px;opacity:.8}
#barw{height:8px;background:rgba(0,0,0,.3);border-radius:4px;margin:2dvh 0;overflow:hidden}
#bar{height:8px;width:0;background:#fff}
#next{font-size:min(6vw,3dvh);font-weight:600}
.sp{flex:1}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2dvh}
button{font-size:18px;font-weight:600;padding:16px 0;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff}
#go{grid-column:1/3;background:#fff;color:#111;font-size:22px;padding:20px 0}
.opts{display:flex;justify-content:space-between;font-size:14px;opacity:.85;margin-top:2dvh}
label{display:flex;gap:6px;align-items:center}
.flash{animation:fl .7s}
@keyframes fl{0%{box-shadow:inset 0 0 0 14px #fff}100%{box-shadow:inset 0 0 0 0 #fff}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><span id="stepcount">Step 1 of 21</span><span id="totalleft">40:30 left</span></div>
  <div id="name">Warm-up easy</div>
  <div id="count">5:00</div>
  <div class="row">
    <div class="box"><div class="lab">Speed</div><div class="big" id="speed">6.0 mph</div><div class="sub" id="pace">10:00 /mi</div></div>
    <div class="box"><div class="lab">Incline</div><div class="big" id="inc">1%</div><div class="sub" id="goal">Goal 5:00</div></div>
  </div>
  <div id="barw"><div id="bar"></div></div>
  <div class="lab">Next up</div>
  <div id="next">Steady 7.0 mph, 1%</div>
  <div class="sp"></div>
  <div class="opts">
    <label><input type="checkbox" id="test"> Test mode (5 s steps)</label>
    <label><input type="checkbox" id="beeps"> Beeps</label>
  </div>
  <div class="opts"><span id="wl">Screen awake: not started</span><span>v0.0</span></div>
  <div class="btns">
    <button id="go">Start</button>
    <button id="back">Back</button>
    <button id="skip">Skip</button>
    <button id="reset" style="grid-column:1/3">Reset</button>
  </div>
</div>
<script>
var S=[];
function add(n,sp,inc,d,t){S.push({n:n,sp:sp,inc:inc,d:d,t:t});}
add('Warm-up easy',6.0,1,300,'w');
add('Steady',7.0,1,180,'w');
add('Pickup',8.8,1,30,'w');add('Easy',6.0,1,30,'w');
add('Pickup',8.8,1,30,'w');add('Easy',6.0,1,30,'w');
var reps=[[9.2,1,'F'],[8.2,5,'H'],[9.2,1,'F'],[7.7,7,'H'],[9.3,1,'F'],[8.2,5,'H'],[9.4,1,'F'],[7.5,8,'H']];
for(var i=0;i<reps.length;i++){
  var r=reps[i];
  add('Rep '+(i+1)+(r[2]=='F'?' flat':' hill'),r[0],r[1],105,r[2]);
  if(i<7)add('Recover',5.5,1,90,'R');
}
add('Cool-down jog',6.0,1,180,'w');
add('Cool-down walk',4.0,0,180,'w');
var N=S.length,idx=0,run=false,endT=0,left=0,ctx=null,wl=null,lastBeep=-1,finished=false;
var $=function(id){return document.getElementById(id);};
function dur(i){return $('test').checked?5:S[i].d;}
function fmt(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}
function pace(sp){return fmt(Math.round(3600/sp))+' /mi';}
function beep(f,d){
  if(!$('beeps').checked)return;
  try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=0.15;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d);}catch(e){}
}
function flash(){var a=$('app');a.classList.remove('flash');void a.offsetWidth;a.classList.add('flash');}
function wake(){
  try{
    if(!('wakeLock' in navigator)){$('wl').textContent='Screen awake: not supported';return;}
    navigator.wakeLock.request('screen').then(function(l){wl=l;$('wl').textContent='Screen awake: on';l.addEventListener('release',function(){$('wl').textContent='Screen awake: released';});}).catch(function(){$('wl').textContent='Screen awake: blocked';});
  }catch(e){$('wl').textContent='Screen awake: error';}
}
function paint(){
  var s=S[idx];
  $('stepcount').textContent='Step '+(idx+1)+' of '+N;
  $('name').textContent=s.n;
  $('count').textContent=fmt(left);
  $('speed').textContent=s.sp.toFixed(1)+' mph';
  $('pace').textContent=pace(s.sp);
  $('inc').textContent=s.inc+'%';
  $('goal').textContent='Goal '+fmt(dur(idx));
  $('bar').style.width=Math.round((1-Math.max(0,left)/dur(idx))*100)+'%';
  var rem=Math.max(0,left);for(var j=idx+1;j<N;j++)rem+=dur(j);
  $('totalleft').textContent=fmt(rem)+' left';
  var nx=S[idx+1];
  $('next').textContent=nx?(nx.n+': '+nx.sp.toFixed(1)+' mph, '+nx.inc+'%, '+fmt(dur(idx+1))):'Finished';
  var bg='#2a2a2a';
  if(s.t=='F')bg='#a32d2d';
  if(s.t=='H')bg='#854f0b';
  if(s.t=='R')bg='#27500a';
  $('app').style.background=bg;
}
function load(i,silent){idx=i;left=dur(i);endT=Date.now()+left*1000;lastBeep=-1;paint();if(!silent)flash();}
function tick(){
  if(!run)return;
  var rem=(endT-Date.now())/1000;left=rem;
  var w=Math.ceil(rem);
  if(w<=3&&w>=1&&w!==lastBeep){lastBeep=w;beep(660,0.12);}
  if(rem<=0){
    if(idx<N-1){beep(990,0.35);load(idx+1);}
    else{run=false;finished=true;left=0;beep(990,0.6);flash();$('go').textContent='Done';paint();}
    return;
  }
  paint();
}
$('go').onclick=function(){
  if(finished){finished=false;load(0,true);}
  run=!run;
  if(run){endT=Date.now()+left*1000;beep(880,0.15);wake();}
  else{left=(endT-Date.now())/1000;try{if(wl)wl.release();}catch(e){}}
  $('go').textContent=run?'Pause':'Resume';
  paint();
};
$('skip').onclick=function(){if(idx<N-1)load(idx+1);paint();};
$('back').onclick=function(){if(idx>0)load(idx-1);paint();};
$('reset').onclick=function(){run=false;finished=false;try{if(wl)wl.release();}catch(e){}load(0,true);$('go').textContent='Start';$('wl').textContent='Screen awake: not started';};
$('test').onchange=function(){$('reset').onclick();};
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&run)wake();});
load(0,true);
setInterval(tick,200);
</script>
</body>
</html>
